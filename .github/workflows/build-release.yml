name: Build Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*.*"
      - "v*.*.*"

env:
  PKG_VERSION: ''
  XCODE_VERSION: '15.4'

permissions:
  contents: write

jobs:
  build:
    name: Build and upload DarkPubg IPA
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Xcode version
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Setup build environment
        run: |
          echo "PKG_VERSION=$(./get-version.sh)" >> $GITHUB_ENV

      - name: Build IPA
        run: |
          DARKSPEED_UNSIGNED=1 ./build-darkspeed.sh

      - name: Collect symbols
        run: |
          if [ -d "DarkPubg.xcarchive/dSYMs" ]; then
            zip -qry packages/DarkPubg_${{ env.PKG_VERSION }}_symbols.zip DarkPubg.xcarchive/dSYMs
          elif [ -d "DarkSpeed.xcarchive/dSYMs" ]; then
            zip -qry packages/DarkSpeed_${{ env.PKG_VERSION }}_symbols.zip DarkSpeed.xcarchive/dSYMs
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LienQuanDS_${{ env.PKG_VERSION }}
          path: |
            packages/*.ipa

      - name: Upload symbols
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: LienQuanDS_${{ env.PKG_VERSION }}_symbols
          path: |
            packages/*_symbols.zip

      - name: Upload release
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: v${{ env.PKG_VERSION }}
          body_path: README.md
          files: |
            packages/*.ipa
            packages/*_symbols.zip
